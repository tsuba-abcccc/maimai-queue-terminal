services:
  maimai-queue-status:
    build: .
    restart: unless-stopped
    environment:
      QUEUE_SYNC_TOKEN: ${QUEUE_SYNC_TOKEN:?QUEUE_SYNC_TOKEN is required}
      QUEUE_BOT_TOKEN: ${QUEUE_BOT_TOKEN:?QUEUE_BOT_TOKEN is required}
      QUEUE_MANAGEMENT_TOKEN: ${QUEUE_MANAGEMENT_TOKEN:?QUEUE_MANAGEMENT_TOKEN is required}
      QUEUE_PROFILE_SCOPE_ID: ${QUEUE_PROFILE_SCOPE_ID:-maimai-q-main}
      QUEUE_DEVICE_ID: ${QUEUE_DEVICE_ID:-}
      QUEUE_PRIMARY_DEVICE_ID: ${QUEUE_PRIMARY_DEVICE_ID:-}
      QUEUE_DATABASE_PATH: /app/data/queue.db
      QUEUE_ONLINE_TIMEOUT_SECONDS: ${QUEUE_ONLINE_TIMEOUT_SECONDS:-90}
      QUEUE_COMMAND_TIMEOUT_SECONDS: ${QUEUE_COMMAND_TIMEOUT_SECONDS:-600}
      QUEUE_COMMAND_CLAIM_LEASE_SECONDS: ${QUEUE_COMMAND_CLAIM_LEASE_SECONDS:-15}
      QUEUE_COMMAND_RETENTION_SECONDS: ${QUEUE_COMMAND_RETENTION_SECONDS:-2592000}
      QUEUE_EVENT_RECIPIENT_RETENTION_SECONDS: ${QUEUE_EVENT_RECIPIENT_RETENTION_SECONDS:-2592000}
      QUEUE_MOBILE_SESSION_TTL_SECONDS: ${QUEUE_MOBILE_SESSION_TTL_SECONDS:-600}
      QUEUE_MOBILE_SESSION_RETENTION_SECONDS: ${QUEUE_MOBILE_SESSION_RETENTION_SECONDS:-86400}
      QUEUE_PLAYER_ACCOUNT_SITE_URL: ${QUEUE_PLAYER_ACCOUNT_SITE_URL:-}
      QUEUE_PLAYER_SESSION_TTL_SECONDS: ${QUEUE_PLAYER_SESSION_TTL_SECONDS:-2592000}
      QUEUE_PLAYER_BINDING_TTL_SECONDS: ${QUEUE_PLAYER_BINDING_TTL_SECONDS:-600}
      QUEUE_PLAYER_AUTH_LIMIT_WINDOW_SECONDS: ${QUEUE_PLAYER_AUTH_LIMIT_WINDOW_SECONDS:-900}
      QUEUE_PLAYER_AUTH_LIMIT_BLOCK_SECONDS: ${QUEUE_PLAYER_AUTH_LIMIT_BLOCK_SECONDS:-900}
      QUEUE_PLAYER_AUTH_LIMIT_FAILURES: ${QUEUE_PLAYER_AUTH_LIMIT_FAILURES:-5}
      QUEUE_PLAYER_COOKIE_SECURE: ${QUEUE_PLAYER_COOKIE_SECURE:-true}
      QUEUE_CORS_ORIGIN: ${QUEUE_CORS_ORIGIN:?QUEUE_CORS_ORIGIN is required}
      # This is the absolute URL encoded into the terminal's mobile-registration QR.
      # Requiring it prevents a misconfigured deployment from producing an unusable
      # relative QR or silently pointing at another site's queue page.
      QUEUE_PUBLIC_SITE_URL: ${QUEUE_PUBLIC_SITE_URL:?QUEUE_PUBLIC_SITE_URL is required}
      QUEUE_LATEST_TERMINAL_VERSION: ${QUEUE_LATEST_TERMINAL_VERSION:-0.12.3}
      QUEUE_LATEST_WEBSITE_VERSION: ${QUEUE_LATEST_WEBSITE_VERSION:-0.12.3}
      QUEUE_LATEST_BOT_VERSION: ${QUEUE_LATEST_BOT_VERSION:-0.3.13}
    volumes:
      - queue-status-data:/app/data
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  queue-status-data:
